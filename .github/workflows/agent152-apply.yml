#[cfg(all(test, windows))]
mod bootoptim_windows_preflight_tests {
    use super::*;

    #[test]
    fn create_no_window_preserves_redirected_stdout_and_stderr() {
        let mut command = std::process::Command::new("cmd.exe");
        command.args([
