name: Agent 152 apply patch

on:
  push:
    branches:
      - "agent152/deterministic-classpath-hidden-preflight-20260913"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent152/deterministic-classpath-hidden-preflight-20260913
          fetch-depth: 0

      - name: Apply bounded source patch
        run: |
          cp .github/workflows/bootoptim-v0.yml /tmp/bootoptim-v0.yml
          python3 tools/agent152_apply.py
          cp /tmp/bootoptim-v0.yml .github/workflows/bootoptim-v0.yml

      - name: Commit source patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/backend/src/launch/mod.rs crates/command/src/command.rs bootoptim-v0/README.md
          git diff --cached --check
          git commit -m "Fix deterministic library order and hide Windows preflight"
          git push origin HEAD:agent152/deterministic-classpath-hidden-preflight-20260913
