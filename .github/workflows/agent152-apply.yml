name: Agent 152 apply patch

on:
  push:
    branches:
      - "agent152/deterministic-classpath-hidden-preflight-20260913"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent152/deterministic-classpath-hidden-preflight-20260913
          fetch-depth: 0

      - name: Apply bounded source patch
        run: python3 tools/agent152_apply.py

      - name: Remove one-shot patch machinery
        run: rm tools/agent152_apply.py .github/workflows/agent152-apply.yml

      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Fix deterministic library order and hide Windows preflight"
          git push origin HEAD:agent152/deterministic-classpath-hidden-preflight-20260913
