name: Agent 162 bootstrap patch

on:
  push:
    branches:
      - "agent162/assets-attribution-probe-20260914"

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent162/assets-attribution-probe-20260914
      - name: Wire isolated diagnostic
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          lib = Path("crates/backend/src/lib.rs")
          text = lib.read_text(encoding="utf-8")
          if "mod asset_probe;" not in text:
              text = text.replace("mod account;\n", "mod account;\nmod asset_probe;\n", 1)
          lib.write_text(text, encoding="utf-8")

          launch = Path("crates/backend/src/launch/mod.rs")
          text = launch.read_text(encoding="utf-8")
          new_func = Path("bootoptim-v0/.agent162-do-assets.tmp").read_text(encoding="utf-8")
          start = text.index("async fn do_asset_objects_load(")
          marker = "\n#[derive(thiserror::Error, Debug)]\npub enum LoadLibrariesError"
          end = text.index(marker, start)
          launch.write_text(text[:start] + new_func + text[end:], encoding="utf-8")

          ci = Path(".github/workflows/bootoptim-v0.yml")
          text = ci.read_text(encoding="utf-8")
          if "Test asset attribution contracts" not in text:
              anchor = "      - name: Test deterministic library order\n"
              insertion = (
                  "      - name: Test asset attribution contracts\n"
                  "        shell: pwsh\n"
                  "        run: cargo test -p backend asset_attribution --frozen --target x86_64-pc-windows-msvc\n\n"
              )
              if anchor not in text:
                  raise SystemExit("CI test anchor missing")
              text = text.replace(anchor, insertion + anchor, 1)
          old_markers = 'foreach ($marker in @("bootoptim.launch_probe.v1", "launcher_pre_java", "java_spawn")) {'
          new_markers = 'foreach ($marker in @("bootoptim.launch_probe.v1", "bootoptim.asset_attribution.v1", "launcher_pre_java", "java_spawn")) {'
          if new_markers not in text:
              if old_markers not in text:
                  raise SystemExit("packaged marker anchor missing")
              text = text.replace(old_markers, new_markers, 1)
          ci.write_text(text, encoding="utf-8")

          Path("bootoptim-v0/.agent162-do-assets.tmp").unlink()
          Path(".github/workflows/agent162-bootstrap.yml").unlink()
          PY
          cargo fmt --all
          cargo test -p backend asset_attribution --frozen
          git config user.name "agent162-bootstrap"
          git config user.email "agent162-bootstrap@users.noreply.github.com"
          git add crates/backend/src/lib.rs crates/backend/src/launch/mod.rs crates/backend/src/asset_probe.rs bootoptim-v0/ASSET_ATTRIBUTION_PROBE.md .github/workflows/bootoptim-v0.yml bootoptim-v0/.agent162-do-assets.tmp .github/workflows/agent162-bootstrap.yml
          git commit -m "Diagnostic: wire asset attribution probe"
          git push origin HEAD:agent162/assets-attribution-probe-20260914
