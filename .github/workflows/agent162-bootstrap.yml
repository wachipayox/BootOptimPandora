name: Agent 162 bootstrap patch

on:
  push:
    branches:
      - "agent162/assets-attribution-probe-20260914"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent162/assets-attribution-probe-20260914
      - name: Apply isolated diagnostic patch
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path

          module = base64.b64decode(" pkaWdlc3QoYnl0ZXMpLmludG8oKQogICAgfQoKICAgIGZuIHJlYWRfc25hcHNob3QocGF0aDogJlBhdGgpIC0+IFZhbHVlIHsKICAgICAgICBzZXJkZV9qc29uOjpmcm9tX3NsaWNlKCZzdGQ6OmZzOjpyZWFkKHBhdGgpLnVud3JhcCgpKS51bndyYXAoKQogICAgfQoKICAgICNb dGVzdF0KICAgIGZuIGFzc2V0X2F0dHJpYnV0aW9uX2Rpc2FibGVkX2NyZWF0ZXNfbm9fcHJvYmUoKSB7CiAgICAgICAgYXNzZXJ0IShBc3NldEF0dHJpYnV0aW9uUHJvYmU6OmZyb21fY29uZmlndXJlZF9wYXRoKE5vbmUsIDEsIDIsIGZhbHNlKS5pc19ub25lKCkpOwogICAgfQoKICAgICNb  ").decode()
          new_func = base64.b64decode(" (&path, expected_hash))
                        .await
                        .unwrap()
                } else {
                    tokio::task::spawn_blocking(move || {
                        crate::fs::check_sha1_hash(&path, expected_hash).unwrap_or(false)
                    })
                    .await
                    .unwrap()
                };
                drop(permit);
                result
            };

            if valid_hash_on_disk {
                assets_tracker.add_count(asset.size as usize);
                return Ok(());
            }

            let was_downloading = started_downloading.swap(true, std::sync::atomic::Ordering::Relaxed);
            if !was_downloading {
                assets_tracker.set_title(Arc::from("Downloading game assets"));
            }

            let permit = download_semaphore.acquire().await.unwrap();
            let network_guard = attribution_probe.as_ref().map(|probe| probe.begin_download());

            let response = match http_client.get(&url).send().await {
                Ok(response) => response,
                Err(error) => {
                    if let Some(probe) = &attribution_probe {
                        probe.record_network_error();
                    }
                    drop(network_guard);
                    drop(permit);
                    return Err(error.into());
                },
            };
            let bytes = match response.bytes().await {
                Ok(bytes) => Arc::new(bytes),
                Err(error) => {
                    if let Some(probe) = &attribution_probe {
                        probe.record_network_error();
                    }
                    drop(network_guard);
                    drop(permit);
                    return Err(error.into());
                },
            };

            if let Some(probe) = &attribution_probe {
                probe.record_downloaded_body(bytes.len());
            }
            drop(network_guard);
            drop(permit);

            if bytes.len() != asset.size as usize {
                if let Some(probe) = &attribution_probe {
                    probe.record_size_failure();
                }
                return Err(LoadAssetObjectsError::WrongResponseSize(asset.size as usize, bytes.len()));
            }

            let correct_hash = {
                let bytes = Arc::clone(&bytes);

                tokio::task::spawn_blocking(move || {
                    let mut hasher = Sha1::new();
                    hasher.update(&*bytes);
                    let actual_hash = hasher.finalize();

                    expected_hash == *actual_hash
                }).await.unwrap()
            };

            if !correct_hash {
                if let Some(probe) = &attribution_probe {
                    probe.record_download_hash_failure();
                }
                return Err(LoadAssetObjectsError::WrongHash);
            }

            tokio::fs::write(path.clone(), &*bytes).await?;
            assets_tracker.add_count(asset.size as usize);
            Ok(())
        };
        tasks.push(task);
    }

    assets_tracker.set_total(total_size as usize);

    let result = futures::future::try_join_all(tasks).await.map(|_| ());

    if let Some(probe) = &attribution_probe {
        probe.finish(if result.is_ok() { "ok" } else { "error" });
    }

    result
}").decode()
          doc = base64.b64decode("").decode()

          Path("crates/backend/src/asset_probe.rs").write_text(module, encoding="utf-8")
          Path("bootoptim-v0/ASSET_ATTRIBUTION_PROBE.md").write_text(doc, encoding="utf-8")

          lib = Path("crates/backend/src/lib.rs")
          text = lib.read_text(encoding="utf-8")
          needle = "mod account;\n"
          replacement = "mod account;\nmod asset_probe;\n"
          if replacement not in text:
              if needle not in text:
                  raise SystemExit("lib.rs insertion anchor missing")
              text = text.replace(needle, replacement, 1)
          lib.write_text(text, encoding="utf-8")

          launch = Path("crates/backend/src/launch/mod.rs")
          text = launch.read_text(encoding="utf-8")
          start = text.index("async fn do_asset_objects_load(")
          end_marker = "\n#[derive(thiserror::Error, Debug)]\npub enum LoadLibrariesError"
          end = text.index(end_marker, start)
          text = text[:start] + new_func + text[end:]
          launch.write_text(text, encoding="utf-8")

          ci = Path(".github/workflows/bootoptim-v0.yml")
          text = ci.read_text(encoding="utf-8")
          anchor = "      - name: Test deterministic library order\n"
          insert = (
              "      - name: Test asset attribution contracts\n"
              "        shell: pwsh\n"
              "        run: cargo test -p backend asset_attribution --frozen --target x86_64-pc-windows-msvc\n\n"
              + anchor
          )
          if "Test asset attribution contracts" not in text:
              if anchor not in text:
                  raise SystemExit("CI test insertion anchor missing")
              text = text.replace(anchor, insert, 1)

          marker_anchor = 'foreach ($marker in @("bootoptim.launch_probe.v1", "launcher_pre_java", "java_spawn")) {'
          marker_replacement = 'foreach ($marker in @("bootoptim.launch_probe.v1", "bootoptim.asset_attribution.v1", "launcher_pre_java", "java_spawn")) {'
          if marker_replacement not in text:
              if marker_anchor not in text:
                  raise SystemExit("packaged marker anchor missing")
              text = text.replace(marker_anchor, marker_replacement, 1)
          ci.write_text(text, encoding="utf-8")

          Path(".github/workflows/agent162-bootstrap.yml").unlink()
          PY

          cargo fmt --all
          git config user.name "agent162-bootstrap"
          git config user.email "agent162-bootstrap@users.noreply.github.com"
          git add crates/backend/src/lib.rs crates/backend/src/asset_probe.rs crates/backend/src/launch/mod.rs bootoptim-v0/ASSET_ATTRIBUTION_PROBE.md .github/workflows/bootoptim-v0.yml .github/workflows/agent162-bootstrap.yml
          git commit -m "Diagnostic: attribute asset verification work"
          git push origin HEAD:agent162/assets-attribution-probe-20260914
