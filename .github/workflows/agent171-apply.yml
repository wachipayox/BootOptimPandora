      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply authority-only patch
        shell: python
        run: |
          import pathlib

          def patch(path, old, new, count=1):
              p = pathlib.Path(path)
              text = p.read_text()
              if text.count(old) < count:
                  raise SystemExit(f"missing patch anchor in {path}: {old[:80]!r}")
              text = text.replace(old, new, count)
              p.write_text(text)

