                "impl ModalAction {\n    pub fn refcnt(&self) -> usize {",
                "impl ModalAction {\n    pub fn normal_gui_launch() -> Self {\n        let inner = ModalActionInner {\n            appcds_launch_authority: AppCdsLaunchAuthority::NormalGui,\n            ..Default::default()\n        };\n        Self(Arc::new(inner))\n    }\n\n    pub fn appcds_launch_authority(&self) -> AppCdsLaunchAuthority {\n        self.0.appcds_launch_authority\n    }\n\n    pub fn refcnt(&self) -> usize {")
