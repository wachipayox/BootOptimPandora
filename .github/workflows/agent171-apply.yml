## Provenance and scope

Base is exactly PR #21 head `agent168/appcds-identity-cache-runtime-20260915@7d39ca0fee2941f71d51361bbc89c383ed69f32e`. PR #21 is stacked on PR #20/#19 and ultimately the PR #7 launch-root lineage. `AGENTS.md` is absent at this authority snapshot (direct GitHub lookup returns 404).

This change implements only the missing AppCDS launch-source authority. It does not change `AssetVerificationMode`, asset repair/download behavior, classpath/module-path/order, Java argv/plan bytes, AppCDS READY/TRAIN/lock/staging/promotion, UI, network, scheduler, Automodpack, MoreCulling/Properties canonicalization, or helper capability.

## Authority contract

`AppCdsLaunchAuthority` is stock-owned launch intent with exactly two values:

- `Unknown` — default for every constructor/caller unless explicitly audited;
- `NormalGui` — constructed only by the existing frontend `root::start_instance` GUI launch helper.

`ModalAction::default()` remains `Unknown`, so backend `StartInstanceByName` (`--run-instance`), API/legacy callers that synthesize/default an action, tests that do not opt into the audited constructor, and future unknown routes cannot authorize AppCDS identity digest reuse. Quick-play launched through the same audited GUI helper carries `NormalGui`; no argument, path, environment value, asset mode, or filesystem observation is used to infer source.

The immutable value is copied through the existing `ModalAction` into `Launcher::launch`, then `LaunchContext`, then a private `PandoraCommand` field. `PandoraCommand` emits one interposer **control** argument before `--`: `--appcds-launch-authority unknown|normal-gui`. It is not appended to Java argv and therefore cannot affect canonical launch-plan bytes. Missing control authority in direct/legacy interposer invocation is `Unknown`; duplicate or malformed control values are rejected and the helper main path fails open to `STOCK`.

The AppCDS identity cache remains default-off (`BOOTOPTIM_APPCDS_IDENTITY_CACHE=1` is still required), Windows/NTFS/capability gated, and every uncertain helper/UAC/IPC/handle/journal/source case remains stock SHA-256. This authority is necessary permission only; it cannot override any other PR #21 miss/fallback gate.

## Automated gates

Portable and Windows tests prove default/legacy `Unknown`, explicit GUI constructor `NormalGui`, clone preservation, command transport default/explicit mapping, interposer control parsing, and `Unknown -> SourceUnknown` reuse rejection.

The Windows packaged gate runs the release interposer against the same synthetic plan once with `unknown` and once with `normal-gui`; `runtime_reuse_authorized` must remain false for unknown and become true only for normal GUI, while `launch-plan.json` stays byte-for-byte identical to the stock baseline. The packaged Pandora EXE is also checked for the authority control markers. This proves transport/linkage only, not performance.

## Physical protocol after green artifact

Use only the matching green Windows artifact and verify `SHA256SUMS.txt`. Keep `BOOTOPTIM_APPCDS_MODE=plan`; combine the PR #7 valid Start->Java root probe with a fresh PR #19 AppCDS preflight sidecar and the aggregate identity-cache sidecar. Do not report Java->menu as part of this claim.

1. **Fallback stock:** feature off. Launch through GUI Start and capture stock plan/probes.
2. **Unknown fallback:** opt-in identity cache but launch through a non-audited/CLI/legacy route where available. Reuse must remain unauthorized and full SHA-256 stock; any UAC/helper activity caused solely by unknown source is a failure.
3. **First GUI seed:** opt in and use the audited GUI Start path. This is baseline/seed only; require valid root/probe schemas and byte-identical plan versus stock for unchanged inputs.
4. **Second GUI reuse candidate:** repeat unchanged GUI Start. Only this run may report reused identity bytes once the PR #21 cache consumer is composed; require the exact same plan bytes and SHA as stock/seed.
5. Exercise feature-off, non-Windows/non-NTFS, missing/mismatched helper pin, UAC cancel/deny, IPC/protocol/PID/ACL failure, protected-handle failure, reparse/non-regular input, journal reset/regression/discontinuity, FileId/USN/final-handle mismatch, corrupt/partial cache and `Unknown` authority. Every case must full-SHA-256 fail open.

Report `appcds_preflight`, PR #19 `build_launch_plan`, aggregate reused/stock bytes and outer PR #7 Start->Java separately. PR #19's physical `build_launch_plan` observation of 307.918 s is motivation only; it is not an A/B saving or TTMM claim. No startup saving is claimed by this authority PR.
''')

