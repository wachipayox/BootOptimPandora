name: Agent171 apply staged patch
on:
  push:
    branches:
      - "agent171/appcds-gui-launch-authority-20260915"
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python .github/agent171_patch.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/bridge/src/modal_action.rs crates/frontend/src/root.rs crates/backend/src/launch/mod.rs crates/command/src/command.rs bootoptim-v0/interposer/src/part1.rs bootoptim-v0/interposer/src/part8.rs .github/workflows/bootoptim-v0.yml
          git commit -m "feat(appcds): propagate audited GUI launch authority"
          git push origin HEAD:agent171/appcds-gui-launch-authority-20260915
