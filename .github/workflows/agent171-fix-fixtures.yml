name: Agent171 fix ParsedArgs fixtures
on:
  push:
    branches:
      - "agent171/appcds-gui-launch-authority-20260915"
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch fail-closed test fixtures
        run: python .github/agent171_fix_parsed_args.py
      - name: Commit fixture updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bootoptim-v0/interposer/src/part4.rs bootoptim-v0/interposer/src/part5.rs bootoptim-v0/interposer/src/part7.rs
          git commit -m "test(appcds): keep ParsedArgs fixtures fail closed"
          git push origin HEAD:agent171/appcds-gui-launch-authority-20260915
