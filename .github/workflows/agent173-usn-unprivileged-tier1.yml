name: Agent 173 USN unprivileged Tier 1

on:
  push:
    branches:
      - agent173/usn-unprivileged-capability-20260915
    paths:
      - bootoptim-v0/usn-unprivileged-probe/**
      - crates/backend/src/asset_usn_cache.rs
      - crates/backend/src/asset_usn_cache/**
      - .github/workflows/agent173-usn-unprivileged-tier1.yml
  workflow_dispatch:

jobs:
  rust-minimal-windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Rust fmt
        run: cargo fmt --all

      - name: Backend Rust check
        run: cargo check -p backend --lib

      - name: Asset USN cache library tests
        run: cargo test -p backend --lib asset_usn_cache

      - name: Restricted-token capability probe
        run: cargo run --manifest-path bootoptim-v0/usn-unprivileged-probe/Cargo.toml
