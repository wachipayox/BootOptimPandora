name: Agent 177 one-shot autofmt

on:
  push:
    branches:
      - "agent177/usn-fast-rebootstrap-20260916"
    paths:
      - ".github/workflows/agent177-one-shot-autofmt.yml"

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent177/usn-fast-rebootstrap-20260916

      - name: Install stable rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format backend only
        run: cargo fmt -p backend

      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No rustfmt changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/backend
          git commit -m "agent177: apply backend rustfmt"
          git push origin HEAD:agent177/usn-fast-rebootstrap-20260916
