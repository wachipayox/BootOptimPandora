name: Agent 177 one-shot packaging expectation patch

on:
  push:
    branches:
      - agent177/usn-fast-rebootstrap-20260916
    paths:
      - .github/workflows/agent177-packaging-selfpatch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent177/usn-fast-rebootstrap-20260916
          fetch-depth: 0
      - name: Update packaged default-fast expectation
        shell: bash
        run: python -c "import base64; exec(base64.b64decode(''))"
      - name: Commit packaging expectation and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "agent177-github-actions"
          git config user.email "agent177-github-actions@users.noreply.github.com"
          git rm .github/workflows/agent177-packaging-selfpatch.yml
          git add .github/workflows/bootoptim-v0.yml
          git diff --cached --check
          git commit -m "agent177: make packaged asset gate expect default fast policy"
          git push origin HEAD:agent177/usn-fast-rebootstrap-20260916
