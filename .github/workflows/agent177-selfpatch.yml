name: Agent 177 one-shot dead hash removal

on:
  push:
    branches:
      - agent177/usn-fast-rebootstrap-20260916
    paths:
      - .github/workflows/agent177-selfpatch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent177/usn-fast-rebootstrap-20260916
          fetch-depth: 0
      - name: Remove dead Windows bulk-hash methods
        shell: bash
        run: python -c "import base64; exec(base64.b64decode(''))"
      - name: Commit cleanup and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "agent177-github-actions"
          git config user.email "agent177-github-actions@users.noreply.github.com"
          git rm .github/workflows/agent177-selfpatch.yml
          git add crates/backend/src/asset_usn_cache/windows_direct.rs
          git diff --cached --check
          git commit -m "agent177: remove dead Windows bulk SHA-1 paths"
          git push origin HEAD:agent177/usn-fast-rebootstrap-20260916
