name: Agent 177 one-shot source patch

on:
  push:
    branches:
      - agent177/usn-fast-rebootstrap-20260916
    paths:
      - .github/workflows/agent177-selfpatch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent177/usn-fast-rebootstrap-20260916
          fetch-depth: 0
      - name: Replace asset verifier join-error SHA-1 fallback
        shell: python
        run: |
          from pathlib import Path

          path = Path("crates/backend/src/launch/mod.rs")
          text = path.read_text(encoding="utf-8")
          old = '''                let stock_path = path.clone();
                let permit = disk_semaphore.acquire().await.unwrap();
                let scoped_probe = attribution_probe.clone();
                let result = match tokio::task::spawn_blocking(move || {
                    crate::asset_probe_context::with_probe(scoped_probe, || {
                        cache_session.verify_existing(&verify_path, &expected_sha1, expected_hash)
                    })
                }).await {
                    Ok(result) => result,
                    Err(_) => {
                        let fallback_probe = attribution_probe.clone();
                        tokio::task::spawn_blocking(move || {
                            fallback_probe.as_ref()
                                .map(|probe| probe.hash_path(&stock_path, expected_hash))
                                .unwrap_or_else(|| crate::fs::check_sha1_hash(&stock_path, expected_hash).unwrap_or(false))
                        }).await.unwrap_or(false)
                    },
                };
'''
          new = '''                let permit = disk_semaphore.acquire().await.unwrap();
                let scoped_probe = attribution_probe.clone();
                let result = match tokio::task::spawn_blocking(move || {
                    crate::asset_probe_context::with_probe(scoped_probe, || {
                        cache_session.verify_existing(&verify_path, &expected_sha1, expected_hash)
                    })
                }).await {
                    Ok(result) => result,
                    // A verifier worker failure is an individual miss. Never compensate by
                    // hashing the existing asset object; the normal download path below
                    // size-checks and SHA-1 verifies only the repaired body.
                    Err(_) => false,
                };
'''
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one source match, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
      - name: Commit code patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "agent177-github-actions"
          git config user.email "agent177-github-actions@users.noreply.github.com"
          git rm .github/workflows/agent177-selfpatch.yml
          git add crates/backend/src/launch/mod.rs
          git diff --cached --check
          git commit -m "agent177: never hash existing asset on verifier task failure"
          git push origin HEAD:agent177/usn-fast-rebootstrap-20260916
