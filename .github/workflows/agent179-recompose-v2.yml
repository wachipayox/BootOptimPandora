name: Agent 179 clean recomposition bootstrap v2

on:
  push:
    branches:
      - agent179/usn-clean-promotion-20260916

permissions:
  contents: write

jobs:
  recompose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Execute approved recomposition without workflow self-mutation
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          p = Path('.github/workflows/agent179-recompose.yml')
          lines = p.read_text().splitlines()
          marker = next(i for i, line in enumerate(lines) if line.strip() == 'run: |')
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines[marker + 1:]) + '\n'

          workflow_start = script.index("cat > .github/workflows/bootoptim-usn-clean.yml <<'EOF'\n")
          script = script[:workflow_start]
          script += "git config user.name github-actions[bot]\n"
          script += "git config user.email 41898282+github-actions[bot]@users.noreply.github.com\n"
          script += "git add crates/backend/src/asset_usn_cache.rs crates/backend/src/asset_usn_cache crates/backend/src/asset_probe_context.rs crates/backend/src/lib.rs crates/backend/src/launch/mod.rs crates/bridge/src/modal_action.rs crates/frontend/src/root.rs bootoptim-v0/USN_CLEAN_PROMOTION.md bootoptim-v0/usn-unprivileged-probe\n"
          script += "git commit -m 'Recompose unprivileged USN asset cache from stock master'\n"
          script += "git push origin HEAD:agent179/usn-clean-promotion-20260916\n"
          Path('/tmp/agent179-recompose.sh').write_text(script)
          PY
          bash /tmp/agent179-recompose.sh
