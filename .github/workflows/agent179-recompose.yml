name: Agent 179 clean recomposition bootstrap

on:
  push:
    branches:
      - agent179/usn-clean-promotion-20260916

permissions:
  contents: write

jobs:
  recompose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recompose only the approved USN asset slices
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=48a07528dff5b8249c8284545e4cc26efb23b49a
          git fetch origin "$SOURCE"
          mkdir -p crates/backend/src/asset_usn_cache/windows bootoptim-v0/usn-unprivileged-probe/src bootoptim-v0 .github/workflows
          for path in \
            crates/backend/src/asset_usn_cache.rs \
            crates/backend/src/asset_usn_cache/activation_probe.rs \
            crates/backend/src/asset_usn_cache/windows.rs \
            crates/backend/src/asset_usn_cache/windows_direct.rs \
            crates/backend/src/asset_usn_cache/windows/direct_integration_tests.rs \
            bootoptim-v0/usn-unprivileged-probe/Cargo.toml \
            bootoptim-v0/usn-unprivileged-probe/src/main.rs; do
            git show "$SOURCE:$path" > "$path"
          done

          cat > crates/backend/src/asset_probe_context.rs <<'EOF'
          use std::{cell::Cell, path::Path};

          thread_local! {
              static HASH_OBSERVED: Cell<bool> = const { Cell::new(false) };
          }

          pub(crate) fn reset_hash_observed() {
              HASH_OBSERVED.with(|slot| slot.set(false));
          }

          pub(crate) fn take_hash_observed() -> bool {
              HASH_OBSERVED.with(|slot| slot.replace(false))
          }

          fn mark_hash_observed() {
              HASH_OBSERVED.with(|slot| slot.set(true));
          }

          pub(crate) fn hash_path_if_active(_path: &Path, _expected: [u8; 20]) -> Option<bool> {
              mark_hash_observed();
              None
          }

          #[cfg(windows)]
          pub(crate) fn hash_open_file_if_active(
              _file: &mut std::fs::File,
              _expected: [u8; 20],
          ) -> Option<bool> {
              mark_hash_observed();
              None
          }
          EOF
          sed -i 's/^          //' crates/backend/src/asset_probe_context.rs

          python3 <<'PY'
          from pathlib import Path

          def must_replace(text, old, new, label, count=1):
              found = text.count(old)
              if found < count:
                  raise SystemExit(f"{label}: expected at least {count} matches, got {found}")
              return text.replace(old, new, count)

          # Strip obsolete helper configuration from the direct assets consumer.
          p = Path('crates/backend/src/asset_usn_cache.rs')
          s = p.read_text()
          s = s.replace('pub(crate) const ASSET_USN_HELPER_ENV: &str = "BOOTOPTIM_ASSET_USN_HELPER";\n', '')
          s = s.replace('pub(crate) const ASSET_USN_HELPER_SHA256_ENV: &str = "BOOTOPTIM_ASSET_USN_HELPER_SHA256";\n', '')
          p.write_text(s)

          # Wire only the two backend modules needed by the cache + v2 observation.
          p = Path('crates/backend/src/lib.rs')
          s = p.read_text()
          s = must_replace(s, 'mod arcfactory;\n', 'mod arcfactory;\nmod asset_probe_context;\nmod asset_usn_cache;\n', 'backend lib insertion')
          p.write_text(s)

          # PR #10 semantics, resolved against stock master without PR #7 launch-probe fields.
          p = Path('crates/bridge/src/modal_action.rs')
          s = p.read_text()
          s = must_replace(s,
              'use tokio_util::sync::CancellationToken;\n\n#[derive(Default, Clone, Debug)]',
              '''use tokio_util::sync::CancellationToken;\n\n#[derive(Clone, Copy, Debug, PartialEq, Eq)]\npub enum AssetVerificationMode {\n    Normal,\n    FullVerification,\n}\n\nimpl Default for AssetVerificationMode {\n    fn default() -> Self {\n        Self::FullVerification\n    }\n}\n\n#[derive(Default, Clone, Debug)]''',
              'asset mode enum')
          s = must_replace(s,
              'impl ModalAction {\n    pub fn refcnt(&self) -> usize {',
              '''impl ModalAction {\n    pub fn normal_launch() -> Self {\n        let mut inner = ModalActionInner::default();\n        inner.asset_verification_mode = AssetVerificationMode::Normal;\n        Self(Arc::new(inner))\n    }\n\n    pub fn asset_verification_mode(&self) -> AssetVerificationMode {\n        self.0.asset_verification_mode\n    }\n\n    pub fn refcnt(&self) -> usize {''',
              'normal launch constructor')
          s = must_replace(s,
              '    trackers: Arc<RwLock<Vec<ProgressTracker>>>,\n    pub request_cancel: CancellationToken,',
              '    trackers: Arc<RwLock<Vec<ProgressTracker>>>,\n    asset_verification_mode: AssetVerificationMode,\n    pub request_cancel: CancellationToken,',
              'modal inner mode')
          s = must_replace(s,
              '            title: RwLock::new(title),\n        }));',
              '            title: RwLock::new(title),\n            asset_verification_mode: self.asset_verification_mode,\n        }));',
              'tracker mode copy')
          s = must_replace(s,
              '            .field("trackers", &self.trackers)\n            .field("request_cancel", &self.request_cancel)',
              '            .field("trackers", &self.trackers)\n            .field("asset_verification_mode", &self.asset_verification_mode)\n            .field("request_cancel", &self.request_cancel)',
              'modal debug mode')
          s = must_replace(s,
              '    title: RwLock<Arc<str>>,\n}',
              '    title: RwLock<Arc<str>>,\n    asset_verification_mode: AssetVerificationMode,\n}',
              'tracker inner mode')
          s = must_replace(s,
              '            .field("finished_at", &self.finished_at.load(Ordering::Relaxed))\n            .finish()\n    }\n}\n\nimpl ProgressTracker {',
              '            .field("finished_at", &self.finished_at.load(Ordering::Relaxed))\n            .field("asset_verification_mode", &self.asset_verification_mode)\n            .finish()\n    }\n}\n\nimpl ProgressTracker {',
              'tracker debug mode')
          s = must_replace(s,
              'impl ProgressTracker {\n    // pub fn id(&self) -> usize {',
              'impl ProgressTracker {\n    pub fn asset_verification_mode(&self) -> AssetVerificationMode {\n        self.0.asset_verification_mode\n    }\n\n    // pub fn id(&self) -> usize {',
              'tracker getter')
          s += '''\n\n#[cfg(test)]\nmod asset_verification_mode_tests {\n    use super::{AssetVerificationMode, ModalAction};\n\n    #[test]\n    fn default_actions_fail_closed_to_full_verification() {\n        let action = ModalAction::default();\n        assert_eq!(action.asset_verification_mode(), AssetVerificationMode::FullVerification);\n        assert_eq!(\n            action.push_tracker("assets".into()).asset_verification_mode(),\n            AssetVerificationMode::FullVerification\n        );\n    }\n\n    #[test]\n    fn normal_gui_authority_survives_clone_and_tracker_creation() {\n        let action = ModalAction::normal_launch();\n        let cloned = action.clone();\n        assert_eq!(cloned.asset_verification_mode(), AssetVerificationMode::Normal);\n        assert_eq!(\n            cloned.push_tracker("assets".into()).asset_verification_mode(),\n            AssetVerificationMode::Normal\n        );\n    }\n}\n'''
          p.write_text(s)

          p = Path('crates/frontend/src/root.rs')
          s = p.read_text()
          s = must_replace(s, '    let modal_action = ModalAction::default();\n', '    let modal_action = ModalAction::normal_launch();\n', 'GUI normal authority')
          p.write_text(s)

          # Integrate the cache at the stock asset verification site only.
          p = Path('crates/backend/src/launch/mod.rs')
          s = p.read_text()
          s = must_replace(s,
              '        let result = do_asset_objects_load(http_client, assets_index, assets_dir, &assets_tracker).await;\n',
              '''        let result = do_asset_objects_load(\n            http_client,\n            assets_index,\n            assets_dir,\n            version_info.asset_index.sha1.as_str(),\n            &assets_tracker,\n        )\n        .await;\n''',
              'asset call wiring')
          s = must_replace(s,
              '''async fn do_asset_objects_load(\n    http_client: &reqwest::Client,\n    assets_index: Arc<AssetsIndex>,\n    assets_objects_dir: Arc<Path>,\n    assets_tracker: &ProgressTracker,\n) -> Result<(), LoadAssetObjectsError> {''',
              '''async fn do_asset_objects_load(\n    http_client: &reqwest::Client,\n    assets_index: Arc<AssetsIndex>,\n    assets_objects_dir: Arc<Path>,\n    asset_index_sha1: &str,\n    assets_tracker: &ProgressTracker,\n) -> Result<(), LoadAssetObjectsError> {''',
              'asset function signature')
          s = must_replace(s,
              '    let _ = std::fs::create_dir_all(&assets_objects_dir);\n\n    for (_, asset) in &assets_index.objects {',
              '''    let _ = std::fs::create_dir_all(&assets_objects_dir);\n\n    let verification_mode = assets_tracker.asset_verification_mode();\n    let expected_hashes = assets_index\n        .objects\n        .iter()\n        .map(|(_, asset)| asset.hash.to_string())\n        .collect::<Vec<_>>();\n    let cache_root = Arc::clone(&assets_objects_dir);\n    let cache_index_sha1 = asset_index_sha1.to_owned();\n    let cache_session = tokio::task::spawn_blocking(move || {\n        crate::asset_usn_cache::AssetUsnCacheSession::begin(\n            verification_mode,\n            &cache_index_sha1,\n            cache_root,\n            expected_hashes,\n        )\n    })\n    .await\n    .unwrap_or_else(|_| {\n        crate::asset_usn_cache::AssetUsnCacheSession::begin(\n            bridge::modal_action::AssetVerificationMode::FullVerification,\n            "",\n            Arc::clone(&assets_objects_dir),\n            Vec::new(),\n        )\n    });\n    let cache_session = Arc::new(cache_session);\n\n    for (_, asset) in &assets_index.objects {''',
              'cache session creation')
          s = must_replace(s,
              '        let disk_semaphore = &disk_semaphore;\n\n        let url = format!',
              '        let disk_semaphore = &disk_semaphore;\n        let cache_session = Arc::clone(&cache_session);\n        let expected_sha1 = asset.hash.to_string();\n\n        let url = format!',
              'cache task captures')
          s = must_replace(s,
              '''            let valid_hash_on_disk = {\n                let path = path.clone();\n                let permit = disk_semaphore.acquire().await.unwrap();\n                let result = tokio::task::spawn_blocking(move || {\n                    crate::fs::check_sha1_hash(&path, expected_hash).unwrap_or(false)\n                }).await.unwrap();\n                drop(permit);\n                result\n            };''',
              '''            let valid_hash_on_disk = {\n                let verify_path = path.clone();\n                let stock_path = path.clone();\n                let permit = disk_semaphore.acquire().await.unwrap();\n                let result = match tokio::task::spawn_blocking(move || {\n                    cache_session.verify_existing(&verify_path, &expected_sha1, expected_hash)\n                })\n                .await\n                {\n                    Ok(result) => result,\n                    Err(_) => tokio::task::spawn_blocking(move || {\n                        crate::fs::check_sha1_hash(&stock_path, expected_hash).unwrap_or(false)\n                    })\n                    .await\n                    .unwrap_or(false),\n                };\n                drop(permit);\n                result\n            };''',
              'cache verify wiring')
          s = must_replace(s,
              '    futures::future::try_join_all(tasks).await?;\n\n    Ok(())\n}',
              '''    futures::future::try_join_all(tasks).await?;\n\n    let cache_session = Arc::clone(&cache_session);\n    let _ = tokio::task::spawn_blocking(move || cache_session.finish()).await;\n\n    Ok(())\n}''',
              'cache publication wiring')
          p.write_text(s)
          PY

          cat > bootoptim-v0/USN_CLEAN_PROMOTION.md <<'EOF'
          # Clean USN assets-cache promotion candidate

          This branch is recomposed from the stock authority `master@4eb6c7849561151695288443c106519774ee05ea`. It is not a merge or rebase of the experimental BootOptim chain.

          ## Included semantic slices

          - PR #10: `AssetVerificationMode::{Normal, FullVerification}`. Only the existing GUI `root::start_instance` constructs `Normal`; default, CLI/`StartInstanceByName`, legacy and unknown callers remain `FullVerification`.
          - PR #9/#11: schema-v1 manifest, fail-closed reuse decision, atomic publication, and the minimal `do_asset_objects_load` integration. Stock verify/download/repair ordering is retained.
          - PR #27: the active Windows capability is the direct unprivileged NTFS adapter (`windows.rs` + `windows_direct.rs`) with protected no-reparse handles, direct journal/FileId/file-USN queries and final identity re-check. The assets consumer contains no elevated helper, named pipe, `usn_protocol`, or helper executable.
          - PR #24/#27: activation sidecar v2 is observational only. It reports `capability_mode=direct_unprivileged_ntfs` and `elevation_requested=false`; it never authorizes reuse.
          - PR #22: only the tiny hash-observation primitive needed for activation-probe accounting is retained. The PR #13/#22 attribution sidecar is excluded because its final composition depends on the independent PR #7 launch-probe lineage.
          - PR #27 standalone restricted-token probe is retained as a Windows semantic gate; it is not production authority.

          ## Explicitly excluded

          PR #7 click-to-Java instrumentation, AppCDS/interposer work, helper/UAC runtime, named-pipe IPC, `usn_protocol`, `bootoptim-usn-helper.exe`, helper packaging, classpath changes, mod/update/UI/login changes, and experimental workflows are not part of this candidate.

          ## Integrity boundary

          Reuse still requires explicit `BOOTOPTIM_ASSET_USN_CACHE=1`, `AssetVerificationMode::Normal`, canonical launcher `assets/objects`, exact asset-index SHA-1, exact expected object SHA-1, NTFS volume identity, journal ID/bounds continuity, FileId, file USN, a protected write/delete-denying no-reparse handle, and unchanged final handle identity. Any uncertainty falls back to Pandora's stock SHA-1/download path.

          The separately assigned policy change that must prevent a *massive* all-assets SHA-1 fallback is intentionally **not** implemented here. This clean promotion candidate preserves the currently validated fallback semantics so that Agent 177's policy change can be reviewed as a subsequent isolated PR.

          ## Physical evidence inherited from the exact PR #27 artifact

          On the target HDD, normal GUI launch reported direct unprivileged NTFS capability with `elevation_requested=false`, no helper and no UAC. The measured seed/reuse pair was 3,911 SHA-1 reads followed by 3,911 verified reuses with zero SHA-1 bytes/network on reuse; the assets phase was 163.319 s then 2.313 s. This is a paired assets-phase observation, not TTMM and not a median. Mutating or deleting one asset caused one SHA-1/repair of 8,565 B. Corrupting the manifest JSON fell back to 3,911 SHA-1 reads and rebuilt it.

          Do not deliberately reset/restamp the OS-global USN journal on a user's machine. Journal discontinuity remains semantic-test coverage. Promotion still requires a physical run from a genuinely non-admin Windows account because the hosted restricted-token probe is only an approximation.

          ## Physical protocol for this artifact

          1. Verify the artifact's commit SHA and checksum, use normal GUI Start, canonical launcher assets, and set `BOOTOPTIM_ASSET_USN_CACHE=1`. Use a fresh `BOOTOPTIM_ASSET_USN_PROBE` path for each launch.
          2. Seed from a valid repaired asset set; require a full baseline and v2 probe `direct_unprivileged_ntfs`, `elevation_requested=false`, with no UAC/helper process.
          3. Launch immediately again unchanged; require verified reuse for every eligible object and zero stock SHA-1 reads/network for that phase.
          4. On disposable copies, test one same-size/restored-mtime mutation and one delete/recreate; only the affected object may take the stock verification/repair path under the current semantics.
          5. Corrupt/truncate the manifest and confirm safe fallback/republication under this candidate. Do not interpret that current fallback as the final mass-hash policy; the follow-up policy PR owns that change.
          6. Repeat the capability/seed/reuse gate while logged into a real standard (non-admin) Windows account. Keep assets-phase time, Start-to-Java, Java-to-menu and TTMM separate.
          EOF
          sed -i 's/^          //' bootoptim-v0/USN_CLEAN_PROMOTION.md

          cat > .github/workflows/bootoptim-usn-clean.yml <<'EOF'
          name: BootOptim USN clean candidate - focused

          on:
            push:
              branches:
                - agent179/usn-clean-promotion-20260916
            pull_request:
              paths:
                - 'crates/backend/**'
                - 'crates/bridge/**'
                - 'crates/frontend/**'
                - 'bootoptim-v0/usn-unprivileged-probe/**'
                - '.github/workflows/bootoptim-usn-clean.yml'

          permissions:
            contents: read

          jobs:
            rust-focused:
              runs-on: ubuntu-22.04
              timeout-minutes: 20
              steps:
                - uses: actions/checkout@v4
                - uses: dtolnay/rust-toolchain@stable
                  with:
                    components: rustfmt
                - name: Install backend system dependencies
                  run: sudo apt-get update --yes && sudo apt-get install --yes libssl-dev libdbus-1-dev libx11-xcb1 libxkbcommon-x11-dev pkg-config libseccomp-dev libfontconfig-dev libudev-dev
                - name: Format affected crates
                  run: cargo fmt --check --package backend --package bridge --package frontend
                - name: Check backend
                  run: cargo check -p backend --frozen
                - name: Test asset verification authority
                  run: cargo test -p bridge asset_verification_mode --frozen
                - name: Test USN cache state machine
                  run: cargo test -p backend asset_usn_cache --frozen

            windows-direct-capability:
              runs-on: windows-2022
              timeout-minutes: 20
              steps:
                - uses: actions/checkout@v4
                - uses: dtolnay/rust-toolchain@stable
                  with:
                    components: rustfmt
                - name: Check backend on Windows
                  run: cargo check -p backend --frozen
                - name: Test USN cache and direct NTFS integration
                  run: cargo test -p backend asset_usn_cache --frozen
                - name: Run restricted-token direct capability probe
                  run: cargo run --manifest-path bootoptim-v0/usn-unprivileged-probe/Cargo.toml --locked
          EOF
          sed -i 's/^          //' .github/workflows/bootoptim-usn-clean.yml

          rm .github/workflows/agent179-recompose.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/backend/src/asset_usn_cache.rs \
                  crates/backend/src/asset_usn_cache \
                  crates/backend/src/asset_probe_context.rs \
                  crates/backend/src/lib.rs \
                  crates/backend/src/launch/mod.rs \
                  crates/bridge/src/modal_action.rs \
                  crates/frontend/src/root.rs \
                  bootoptim-v0/USN_CLEAN_PROMOTION.md \
                  bootoptim-v0/usn-unprivileged-probe \
                  .github/workflows/bootoptim-usn-clean.yml \
                  .github/workflows/agent179-recompose.yml
          git commit -m "Recompose unprivileged USN asset cache from stock master"
          git push origin HEAD:agent179/usn-clean-promotion-20260916
