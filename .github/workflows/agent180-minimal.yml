name: Agent 180 focused Rust gate

on:
  push:
    branches:
      - "agent180/prelaunch-real-attribution-20260916"
    paths:
      - "crates/backend/src/backend.rs"
      - "crates/backend/src/backend_handler.rs"
      - "crates/backend/src/lib.rs"
      - "crates/backend/src/prelaunch_attribution.rs"
      - "crates/bridge/src/launch_probe.rs"
      - "bootoptim-v0/PRELAUNCH_REAL_ATTRIBUTION.md"
      - ".github/workflows/agent180-minimal.yml"
  pull_request:
    branches:
      - "agent175/prelaunch-mods-attribution-20260915"
    paths:
      - "crates/backend/src/backend.rs"
      - "crates/backend/src/backend_handler.rs"
      - "crates/backend/src/lib.rs"
      - "crates/backend/src/prelaunch_attribution.rs"
      - "crates/bridge/src/launch_probe.rs"
      - "bootoptim-v0/PRELAUNCH_REAL_ATTRIBUTION.md"
      - ".github/workflows/agent180-minimal.yml"

permissions:
  contents: read

concurrency:
  group: agent180-focused-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-focused:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install backend build dependencies
        run: sudo apt-get update --yes && sudo apt-get install --yes libssl-dev libdbus-1-dev libx11-xcb1 libxkbcommon-x11-dev pkg-config libseccomp-dev libfontconfig-dev libudev-dev
      - name: Check formatting of affected Rust paths only
        run: rustfmt --edition 2024 --config skip_children=true --check crates/backend/src/backend.rs crates/backend/src/backend_handler.rs crates/backend/src/lib.rs crates/backend/src/prelaunch_attribution.rs crates/bridge/src/launch_probe.rs
      - name: Check backend tests
        run: cargo check -p backend --tests --frozen
      - name: Test attribution serialization and disabled invariant
        run: cargo test -p backend prelaunch_attribution --frozen -- --test-threads=1
      - name: Test launch-root correlation contract
        run: cargo test -p bridge launch_probe --frozen -- --test-threads=1
