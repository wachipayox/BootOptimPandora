name: Agent 189 focused profile identity and lock gate

on:
  push:
    branches:
      - "agent189/profile-layout-identity-lock-20260916"
    paths:
      - "crates/backend/Cargo.toml"
      - "crates/backend/src/duplicate.rs"
      - "crates/backend/src/lib.rs"
      - "crates/backend/src/profile_layout_identity.rs"
      - "crates/backend/src/profile_layout_service.rs"
      - "bootoptim-v0/PERSISTENT_PROFILE_LAYOUT_IDENTITY_LOCK.md"
      - ".github/workflows/agent189-minimal.yml"
  pull_request:
    branches:
      - "agent188/profile-layout-client-flow-20260916"
    paths:
      - "crates/backend/Cargo.toml"
      - "crates/backend/src/duplicate.rs"
      - "crates/backend/src/lib.rs"
      - "crates/backend/src/profile_layout_identity.rs"
      - "crates/backend/src/profile_layout_service.rs"
      - "bootoptim-v0/PERSISTENT_PROFILE_LAYOUT_IDENTITY_LOCK.md"
      - ".github/workflows/agent189-minimal.yml"

permissions:
  contents: read

concurrency:
  group: agent189-focused-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-focused:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install backend build dependencies
        run: sudo apt-get update --yes && sudo apt-get install --yes libssl-dev libdbus-1-dev libx11-xcb1 libxkbcommon-x11-dev pkg-config libseccomp-dev libfontconfig-dev libudev-dev
      - name: Check formatting of affected Rust paths
        run: rustfmt --edition 2024 --config skip_children=true --check crates/backend/src/duplicate.rs crates/backend/src/lib.rs crates/backend/src/profile_layout_identity.rs crates/backend/src/profile_layout_service.rs
      - name: Check backend tests
        run: cargo check -p backend --tests --frozen
      - name: Test profile identity, clone, lock, ownership and recovery
        run: cargo test -p backend profile_layout --frozen -- --test-threads=1
