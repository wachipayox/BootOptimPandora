name: Agent 201 exact clone and instance toggle

on:
  push:
    branches:
      - "agent201/appcds-exact-clone-toggle-20260921"
  pull_request:
    paths:
      - "bootoptim-v0/interposer/**"
      - "bootoptim-v0/APPCDS_EXACT_CLONE_AND_INSTANCE_TOGGLE.md"
      - "crates/schema/src/instance.rs"
      - "crates/bridge/src/message.rs"
      - "crates/command/src/command.rs"
      - "crates/backend/src/duplicate.rs"
      - "crates/backend/src/backend_handler.rs"
      - "crates/backend/src/launch/mod.rs"
      - "crates/frontend/src/modals/duplicate_instance.rs"
      - "crates/frontend/src/pages/instance/settings_subpage.rs"
      - ".github/workflows/agent201-appcds-exact-clone-toggle.yml"

permissions:
  contents: read

concurrency:
  group: agent201-appcds-exact-clone-toggle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focal-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install workspace system dependencies
        run: sudo apt-get update --yes && sudo apt-get install --yes libssl-dev libdbus-1-dev libx11-xcb1 libxkbcommon-x11-dev pkg-config libseccomp-dev libfontconfig-dev libudev-dev
      - name: Diff whitespace gate
        run: git diff --check 3410b4c47eec0f47012d3c33bbd5e1d58b669e14...HEAD
      - name: Format new exact-clone module
        run: rustfmt --check --edition 2024 bootoptim-v0/interposer/src/exact_clone.rs
      - name: Focused compile
        run: cargo check -p schema -p bridge -p command -p backend -p frontend --tests --frozen
      - name: Preference schema tests
        run: cargo test -p schema bootoptim_appcds_instance_preference_tests --frozen
      - name: Launch toggle tests
        run: cargo test -p command bootoptim_appcds_instance_toggle_tests --frozen
      - name: Clone isolation and exact-candidate tests
        run: |
          cargo test -p backend duplicate_skips_appcds_cache_but_preserves_other_bootoptim_state --frozen -- --test-threads=1
          cargo test -p backend exact_clone --frozen -- --test-threads=1
      - name: Interposer exact-clone and profile tests
        run: cargo test --manifest-path bootoptim-v0/interposer/Cargo.toml --locked

  focal-windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: agent201-appcds-exact-clone-toggle-windows
      - name: Interposer native lock and exact-clone tests
        run: cargo test --manifest-path bootoptim-v0/interposer/Cargo.toml --locked --target x86_64-pc-windows-msvc
      - name: Backend exact-clone tests
        run: cargo test -p backend exact_clone --frozen --target x86_64-pc-windows-msvc -- --test-threads=1


  final-windows-release:
    needs: [focal-linux, focal-windows]
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: agent201-appcds-exact-clone-toggle-windows
      - name: Build release interposer
        run: cargo build --manifest-path bootoptim-v0/interposer/Cargo.toml --release --locked --target x86_64-pc-windows-msvc
      - name: Build release Pandora
        run: cargo build --release --frozen --target x86_64-pc-windows-msvc
      - name: Verify packaged control linkage
        shell: pwsh
        run: |
          $launcher = "target/x86_64-pc-windows-msvc/release/pandora_launcher.exe"
          $ascii = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($launcher))
          foreach ($marker in @("AppCDS enabled", "Exact local clone", "BOOTOPTIM_INTERPOSER")) {
            if (-not $ascii.Contains($marker)) { throw "release Pandora missing marker: $marker" }
          }
      - name: Assemble candidate artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bootoptim-v0/dist-agent201-continuation | Out-Null
          Copy-Item bootoptim-v0/interposer/target/x86_64-pc-windows-msvc/release/bootoptim-launch-interposer.exe bootoptim-v0/dist-agent201-continuation/
          Copy-Item target/x86_64-pc-windows-msvc/release/pandora_launcher.exe bootoptim-v0/dist-agent201-continuation/BootOptimPandora-v0.exe
          $files = @(
            "bootoptim-v0/dist-agent201-continuation/bootoptim-launch-interposer.exe",
            "bootoptim-v0/dist-agent201-continuation/BootOptimPandora-v0.exe"
          )
          $lines = foreach ($file in $files) {
            $hash = Get-FileHash -Algorithm SHA256 $file
            "{0}  {1}" -f $hash.Hash.ToLowerInvariant(), (Split-Path $file -Leaf)
          }
          $lines | Set-Content -Encoding ascii bootoptim-v0/dist-agent201-continuation/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bootoptim-pandora-agent201-continuation-windows-x86_64
          path: bootoptim-v0/dist-agent201-continuation/*
          if-no-files-found: error
