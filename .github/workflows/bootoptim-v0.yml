name: BootOptim v0 interposer

on:
  pull_request:
    paths:
      - "bootoptim-v0/**"
      - "crates/command/**"
      - "crates/bridge/**"
      - "crates/backend/**"
      - "crates/frontend/**"
      - "crates/pandora_launcher/**"
      - ".github/workflows/bootoptim-v0.yml"

permissions:
  contents: read

concurrency:
  group: bootoptim-v0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hosted-runner-diagnostic:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install backend system dependencies
        run: sudo apt-get update --yes && sudo apt-get install --yes libssl-dev libdbus-1-dev libx11-xcb1 libxkbcommon-x11-dev pkg-config libseccomp-dev libfontconfig-dev libudev-dev
      - name: Run portable interposer tests
        run: cargo test --manifest-path bootoptim-v0/interposer/Cargo.toml --locked
      - name: Test final launch-probe root contract
        run: cargo test -p bridge launch_probe --frozen
      - name: Test asset attribution probe
        run: cargo test -p backend asset_attribution --frozen
      - name: Test asset verification intent propagation
        run: cargo test -p bridge asset_verification_mode --frozen
      - name: Test USN fail-closed/runtime gates
        run: cargo test -p backend asset_usn_cache --frozen
      - name: Test fixed-size USN protocol
        run: cargo test -p backend usn_protocol --frozen

  windows-v0:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Test standalone interposer
        run: cargo test --manifest-path bootoptim-v0/interposer/Cargo.toml --locked --target x86_64-pc-windows-msvc
      - name: Test final launch-probe root contract
        run: cargo test -p bridge launch_probe --frozen --target x86_64-pc-windows-msvc
      - name: Test direct Java spawn probe filter
        run: cargo test -p command launch_probe_tests --frozen --target x86_64-pc-windows-msvc
      - name: Test asset attribution probe
        run: cargo test -p backend asset_attribution --frozen --target x86_64-pc-windows-msvc
      - name: Test asset verification intent propagation
        run: cargo test -p bridge asset_verification_mode --frozen --target x86_64-pc-windows-msvc
      - name: Test USN fail-closed/runtime gates
        run: cargo test -p backend asset_usn_cache --frozen --target x86_64-pc-windows-msvc
      - name: Test fixed-size USN protocol
        run: cargo test -p backend usn_protocol --frozen --target x86_64-pc-windows-msvc
      - name: Test deterministic library order
        shell: pwsh
        run: cargo test -p backend bootoptim_library_order_tests --frozen --target x86_64-pc-windows-msvc
      - name: Repeat deterministic order in independent processes
        shell: pwsh
        run: |
          1..3 | ForEach-Object {
            cargo test -p backend deterministic_across_equivalent_collections --frozen --target x86_64-pc-windows-msvc
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Test hidden preflight pipe semantics
        shell: pwsh
        run: cargo test -p command bootoptim_windows_preflight_tests --frozen --target x86_64-pc-windows-msvc

      - name: Build standalone interposer
        run: cargo build --manifest-path bootoptim-v0/interposer/Cargo.toml --release --locked --target x86_64-pc-windows-msvc
      - name: Build ephemeral USN helper
        run: cargo build -p backend --bin bootoptim-usn-helper --release --frozen --target x86_64-pc-windows-msvc
      - name: Pin ephemeral USN helper into Pandora build
        shell: pwsh
        run: |
          $helper = "target/x86_64-pc-windows-msvc/release/bootoptim-usn-helper.exe"
          $hash = (Get-FileHash -Algorithm SHA256 $helper).Hash.ToLowerInvariant()
          "BOOTOPTIM_ASSET_USN_HELPER_SHA256_PIN=$hash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build patched Pandora
        run: cargo build --release --frozen --target x86_64-pc-windows-msvc

      - name: Execute packaged Pandora root plus asset-sidecar behavior gate
        shell: pwsh
        run: |
          $exe = (Resolve-Path "target/x86_64-pc-windows-msvc/release/pandora_launcher.exe").Path
          $id = [guid]::NewGuid().ToString("N")
          $probe = Join-Path $env:RUNNER_TEMP "bootoptim-agent170-root-$id.jsonl"
          $sidecar = Join-Path $env:RUNNER_TEMP "bootoptim-agent170-assets-$id.json"
          $fakeRuntime = Join-Path $env:RUNNER_TEMP "bootoptim-agent170-fake-runtime-$id"
          $fakeDir = Join-Path $fakeRuntime "bin"
          $fakeLib = Join-Path $fakeRuntime "lib"
          New-Item -ItemType Directory -Force $fakeDir | Out-Null
          New-Item -ItemType Directory -Force $fakeLib | Out-Null
          $fakeJava = Join-Path $fakeDir "java.exe"
          Copy-Item "$env:SystemRoot/System32/cmd.exe" $fakeJava -Force
          if ((Test-Path $probe) -or (Test-Path $sidecar)) { throw "gate output paths must be fresh" }

          function Invoke-PackagedPandora([string[]] $Arguments) {
            $startInfo = [System.Diagnostics.ProcessStartInfo]::new()
            $startInfo.FileName = $exe
            $startInfo.UseShellExecute = $false
            foreach ($argument in $Arguments) { [void] $startInfo.ArgumentList.Add($argument) }
            $process = [System.Diagnostics.Process]::Start($startInfo)
            if ($null -eq $process) { throw "unable to start packaged Pandora" }
            try {
              $process.WaitForExit()
              return [int] $process.ExitCode
            } finally {
              $process.Dispose()
            }
          }

          # This gate deliberately exercises stock behavior: USN is absent.
          Remove-Item Env:BOOTOPTIM_ASSET_USN_CACHE -ErrorAction SilentlyContinue
          Remove-Item Env:BOOTOPTIM_ASSET_USN_HELPER -ErrorAction SilentlyContinue
          Remove-Item Env:BOOTOPTIM_ASSET_USN_HELPER_SHA256 -ErrorAction SilentlyContinue
          $env:BOOTOPTIM_LAUNCH_PROBE = $probe
          $env:BOOTOPTIM_ASSET_ATTRIBUTION = $sidecar
          $code = Invoke-PackagedPandora @("--internal-bootoptim-probe-composition-selftest", $probe, $sidecar, $fakeJava)
          Remove-Item Env:BOOTOPTIM_LAUNCH_PROBE -ErrorAction SilentlyContinue
          Remove-Item Env:BOOTOPTIM_ASSET_ATTRIBUTION -ErrorAction SilentlyContinue
          if ($code -ne 0) { throw "packaged composition selftest failed with exit $code" }
          if (-not (Test-Path $probe)) { throw "packaged composition selftest did not produce launch root" }
          if (-not (Test-Path $sidecar)) { throw "packaged composition selftest did not produce asset sidecar" }

          $rawLines = @(Get-Content $probe | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          if ($rawLines.Count -eq 0) { throw "packaged probe JSONL is empty" }
          $raw = $rawLines -join "`n"
          if ($raw -match 'inclusive_') { throw "legacy inclusive_* probe format detected" }
          $records = @($rawLines | ForEach-Object { $_ | ConvertFrom-Json })
          if (@($records | Where-Object { $_.schema -ne "bootoptim.launch_probe.v1" }).Count -ne 0) {
            throw "packaged probe JSONL is not current bootoptim.launch_probe.v1 format"
          }
          if ($records[0].phase -ne "launcher_pre_java" -or $records[0].event -ne "begin") {
            throw "launcher_pre_java.begin must be the first JSONL record"
          }
          $rootBegin = @($records | Where-Object { $_.phase -eq "launcher_pre_java" -and $_.event -eq "begin" })
          $rootEnd = @($records | Where-Object { $_.phase -eq "launcher_pre_java" -and $_.event -eq "end" })
          $javaBegin = @($records | Where-Object { $_.phase -eq "java_spawn" -and $_.event -eq "begin" })
          $javaEnd = @($records | Where-Object { $_.phase -eq "java_spawn" -and $_.event -eq "end" })
          if ($rootBegin.Count -ne 1 -or $rootEnd.Count -ne 1) { throw "root begin/end must each occur exactly once" }
          if ($javaBegin.Count -ne 1 -or $javaEnd.Count -ne 1) { throw "java_spawn begin/end must each occur exactly once" }
          if ($rootEnd[0].outcome -ne "ok" -or $javaEnd[0].outcome -ne "ok") { throw "root/java spawn outcome must be ok" }
          $javaBeginIndex = -1; $javaEndIndex = -1; $rootEndIndex = -1
          for ($i = 0; $i -lt $records.Count; $i++) {
            if ($records[$i].phase -eq "java_spawn" -and $records[$i].event -eq "begin") { $javaBeginIndex = $i }
            if ($records[$i].phase -eq "java_spawn" -and $records[$i].event -eq "end") { $javaEndIndex = $i }
            if ($records[$i].phase -eq "launcher_pre_java" -and $records[$i].event -eq "end") { $rootEndIndex = $i }
          }
          if (-not (0 -le $javaBeginIndex -and $javaBeginIndex -lt $javaEndIndex -and $javaEndIndex -lt $rootEndIndex)) {
            throw "java spawn must complete inside the unique launch root"
          }

          $asset = Get-Content $sidecar -Raw | ConvertFrom-Json
          if ($asset.schema -ne "bootoptim.asset_attribution.v1") { throw "asset sidecar schema mismatch" }
          if ($asset.phase -ne "assets_verify_download" -or $asset.outcome -ne "ok") { throw "asset sidecar outcome mismatch" }
          if ($asset.launch_probe_active -ne $true) { throw "asset sidecar was not correlated with active launch probe" }
          if ($asset.planned_objects -ne 1 -or $asset.hash_attempts -ne 1 -or $asset.hash_hits -ne 1) { throw "asset fixture was not actually hashed by attribution probe" }
          if ($asset.hash_misses -ne 0 -or $asset.hash_io_errors -ne 0 -or $asset.any_network -ne $false -or $asset.downloaded_objects -ne 0 -or $asset.downloaded_bytes -ne 0 -or $asset.network_errors -ne 0 -or $asset.download_size_failures -ne 0 -or $asset.download_hash_failures -ne 0) {
            throw "asset fixture sidecar is contaminated"
          }

          Copy-Item $probe "bootoptim-packaged-probe-contract.jsonl"
          Copy-Item $sidecar "bootoptim-packaged-asset-attribution.json"
          "schema=bootoptim.launch_probe.v1 root_begin=1 root_end=1 java_spawn=1; schema=bootoptim.asset_attribution.v1 outcome=ok launch_probe_active=true"

      - name: Assemble reproducible Windows artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bootoptim-v0/dist | Out-Null
          Copy-Item bootoptim-v0/interposer/target/x86_64-pc-windows-msvc/release/bootoptim-launch-interposer.exe bootoptim-v0/dist/
          Copy-Item target/x86_64-pc-windows-msvc/release/bootoptim-usn-helper.exe bootoptim-v0/dist/
          Copy-Item target/x86_64-pc-windows-msvc/release/pandora_launcher.exe bootoptim-v0/dist/BootOptimPandora-v0.exe
          Copy-Item bootoptim-packaged-probe-contract.jsonl bootoptim-v0/dist/packaged-probe-contract.jsonl
          Copy-Item bootoptim-packaged-asset-attribution.json bootoptim-v0/dist/packaged-asset-attribution.json
          "${{ github.event.pull_request.head.sha }}" | Set-Content -Encoding ascii bootoptim-v0/dist/COMMIT.txt
          $files = @(
            "bootoptim-v0/dist/bootoptim-launch-interposer.exe",
            "bootoptim-v0/dist/bootoptim-usn-helper.exe",
            "bootoptim-v0/dist/BootOptimPandora-v0.exe",
            "bootoptim-v0/dist/packaged-probe-contract.jsonl",
            "bootoptim-v0/dist/packaged-asset-attribution.json",
            "bootoptim-v0/dist/COMMIT.txt"
          )
          $lines = foreach ($file in $files) {
            $h = Get-FileHash -Algorithm SHA256 $file
            "{0}  {1}" -f $h.Hash.ToLowerInvariant(), (Split-Path $file -Leaf)
          }
          $lines | Set-Content -Encoding ascii bootoptim-v0/dist/SHA256SUMS.txt
          Get-Content bootoptim-v0/dist/SHA256SUMS.txt

      - name: Upload Windows prototype
        uses: actions/upload-artifact@v4
        with:
          name: bootoptim-pandora-agent170-${{ github.event.pull_request.head.sha }}-windows-x86_64
          path: bootoptim-v0/dist/*
          if-no-files-found: error
