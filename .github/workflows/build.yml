name: build
on:
  pull_request:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"

jobs:
  build:
    if: ${{ github.ref_name != 'agent175/prelaunch-mods-attribution-20260915' && github.head_ref != 'agent175/prelaunch-mods-attribution-20260915' && github.ref_name != 'agent180/prelaunch-real-attribution-20260916' && github.head_ref != 'agent180/prelaunch-real-attribution-20260916' && github.ref_name != 'agent188/profile-layout-client-flow-20260916' && github.head_ref != 'agent188/profile-layout-client-flow-20260916' && github.ref_name != 'agent189/profile-layout-identity-lock-20260916' && github.head_ref != 'agent189/profile-layout-identity-lock-20260916' && github.ref_name != 'agent190/profile-layout-native-gates-20260916' && github.head_ref != 'agent190/profile-layout-native-gates-20260916' && github.ref_name != 'agent194/quickplay-launch-yield-20260920' && github.head_ref != 'agent194/quickplay-launch-yield-20260920' && github.ref_name != 'agent201/appcds-exact-clone-toggle-20260921' && github.head_ref != 'agent201/appcds-exact-clone-toggle-20260921' }}
    strategy:
      fail-fast: true
      matrix:
        platform:
          - os_name: Linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binext: ""
          - os_name: Windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binext: .exe
          - os_name: MacOS-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            binext: ""

    runs-on: ${{ matrix.platform.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Install needed packages on Linux
        run: sudo apt-get update --yes && sudo apt-get install --yes libssl-dev libdbus-1-dev libx11-xcb1 libxkbcommon-x11-dev pkg-config libseccomp-dev libfontconfig-dev libudev-dev
        if: contains(matrix.platform.os, 'ubuntu')

      - name: Install mold linker
        uses: rui314/setup-mold@v1

      - name: Run build command
        run: cargo build --release --frozen --target ${{ matrix.platform.target }}
