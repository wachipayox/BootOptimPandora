name: build
on:
  pull_request:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"

jobs:
  build:
    if: ${{ github.ref_name != 'agent175/prelaunch-mods-attribution-20260915' && github.head_ref != 'agent175/prelaunch-mods-attribution-20260915' && github.ref_name != 'agent180/prelaunch-real-attribution-20260916' && github.head_ref != 'agent180/prelaunch-real-attribution-20260916' && github.ref_name != 'agent188/profile-layout-client-flow-20260916' && github.head_ref != 'agent188/profile-layout-client-flow-20260916' && github.ref_name != 'agent189/profile-layout-identity-lock-20260916' && github.head_ref != 'agent189/profile-layout-identity-lock-20260916' && github.ref_name != 'agent190/profile-layout-native-gates-20260916' && github.head_ref != 'agent190/profile-layout-native-gates-20260916' && github.ref_name != 'agent194/quickplay-launch-yield-20260920' && github.head_ref != 'agent194/quickplay-launch-yield-20260920' && github.ref_name != 'agent204/libraries-launchfast-recompose-20260922-v2' && github.head_ref != 'agent204/libraries-launchfast-recompose-20260922-v2' }}
    strategy:
      fail-fast: true
      matrix:
        platform:
          - os_name: Linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binext: ""
          - os_name: Windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binext: .exe
          - os_name: MacOS-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            binext: ""

    runs-on: ${{ matrix.platform.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Install needed packages on Linux
        run: sudo apt-get update --yes && sudo apt-get install --yes libssl-dev libdbus-1-dev libx11-xcb1 libxkbcommon-x11-dev pkg-config libseccomp-dev libfontconfig-dev libudev-dev
        if: contains(matrix.platform.os, 'ubuntu')

      - name: Install mold linker
        uses: rui314/setup-mold@v1

      - name: Run build command
        env:
          WBOMBO_DISTRIBUTION_DEFAULT_URL: ${{ secrets.WBOMBO_DISTRIBUTION_DEFAULT_URL }}
          WBOMBO_COMMUNITY_DISCORD_URL: ${{ secrets.WBOMBO_COMMUNITY_DISCORD_URL }}
        run: cargo build --release --frozen --target ${{ matrix.platform.target }}

      - name: Name Windows artifact with short SHA
        id: short_sha
        if: matrix.platform.os_name == 'Windows-x86_64' && (github.event_name == 'pull_request' || github.ref_name == 'agent/integration-current')
        shell: pwsh
        run: '"sha=$($env:GITHUB_SHA.Substring(0, 7))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8'

      - name: Upload Windows launcher artifact
        if: matrix.platform.os_name == 'Windows-x86_64' && (github.event_name == 'pull_request' || github.ref_name == 'agent/integration-current')
        uses: actions/upload-artifact@v4
        with:
          name: pandora-windows-x86_64-${{ steps.short_sha.outputs.sha }}
          path: target/${{ matrix.platform.target }}/release/pandora_launcher${{ matrix.platform.binext }}
          if-no-files-found: error
          retention-days: 14

      - name: Check optional Windows framebuffer capture
        if: matrix.platform.os_name == 'Windows-x86_64'
        run: cargo check --release -p pandora_launcher --features ui-capture --frozen --target ${{ matrix.platform.target }}

  backend-tests-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Run backend library tests on Windows
        run: cargo test -p backend --lib --frozen
