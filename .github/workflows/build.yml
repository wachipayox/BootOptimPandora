name: build
on:
  pull_request:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        platform:
          - os_name: Linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binext: ""
          - os_name: Windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binext: .exe
          - os_name: MacOS-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            binext: ""

    runs-on: ${{ matrix.platform.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Install needed packages on Linux
        run: sudo apt-get update --yes && sudo apt-get install --yes libssl-dev libdbus-1-dev libx11-xcb1 libxkbcommon-x11-dev pkg-config libseccomp-dev libfontconfig-dev libudev-dev
        if: contains(matrix.platform.os, 'ubuntu')

      - name: Install mold linker
        uses: rui314/setup-mold@v1

      - name: Test final launch-probe root contract
        run: cargo test -p bridge launch_probe --frozen --target ${{ matrix.platform.target }}

      - name: Test direct Java spawn probe filter
        if: contains(matrix.platform.os, 'windows')
        run: cargo test -p command launch_probe_tests --frozen --target ${{ matrix.platform.target }}

      - name: Test USN asset-cache runtime gates
        run: cargo test -p backend asset_usn_cache --frozen --target ${{ matrix.platform.target }}

      - name: Test fixed-size USN protocol
        run: cargo test -p backend usn_protocol --frozen --target ${{ matrix.platform.target }}

      - name: Test asset verification intent propagation
        run: cargo test -p bridge asset_verification_mode --frozen --target ${{ matrix.platform.target }}

      - name: Build ephemeral USN helper
        if: contains(matrix.platform.os, 'windows')
        run: cargo build -p backend --bin bootoptim-usn-helper --release --frozen --target ${{ matrix.platform.target }}

      - name: Pin ephemeral USN helper into Pandora build
        if: contains(matrix.platform.os, 'windows')
        shell: pwsh
        run: |
          $helper = "target/${{ matrix.platform.target }}/release/bootoptim-usn-helper.exe"
          $hash = (Get-FileHash -Algorithm SHA256 $helper).Hash.ToLowerInvariant()
          "BOOTOPTIM_ASSET_USN_HELPER_SHA256_PIN=$hash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run build command
        run: cargo build --release --frozen --target ${{ matrix.platform.target }}
