name: CD

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        platform:
          - os_name: Linux-x86_64
            os: ubuntu-latest
            targets: x86_64-unknown-linux-gnu
            buildscript: ./scripts/build_linux.sh
          - os_name: Windows-x86_64
            os: windows-latest
            targets: x86_64-pc-windows-msvc
            buildscript: ./scripts/build_windows.sh
          - os_name: MacOS-arm64
            os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            buildscript: ./scripts/build_mac.sh

    runs-on: ${{ matrix.platform.os }}
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('vendor/**/.cargo-checksum.json') }}
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Install mold linker
        uses: rui314/setup-mold@v1

      - name: Run build script
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.SIGNER_SECRET_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.SIGNER_PASSWORD }}
          PANDORA_UPDATE_PUBKEY: ${{ secrets.SIGNER_PUBLIC_KEY }}
          GITHUB_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          PANDORA_DISTRIBUTION: official
          WBOMBO_DISTRIBUTION_DEFAULT_URL: ${{ secrets.WBOMBO_DISTRIBUTION_DEFAULT_URL }}
          WBOMBO_COMMUNITY_DISCORD_URL: ${{ secrets.WBOMBO_COMMUNITY_DISCORD_URL }}
          # Optional Authenticode identity for the Windows exe, uninstaller and
          # installer (docs/features/windows-installer.md).
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ secrets.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ secrets.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          AZURE_ARTIFACT_SIGNING_PROFILE: ${{ secrets.AZURE_ARTIFACT_SIGNING_PROFILE }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          WINDOWS_SIGN_PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
          WINDOWS_SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
        run: ${{ matrix.platform.buildscript }} ${{ github.ref_name }}
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.platform.os_name }}
          path: dist/*
  release:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: ./artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
