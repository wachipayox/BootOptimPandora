name: Combined Pandora laptop smoke artifact

on:
  push:
    branches:
      - "codex/pandora-combined-smoke-20260921"

permissions:
  contents: read

concurrency:
  group: combined-pandora-laptop-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-artifact:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: combined-pandora-laptop-smoke
      - name: Focused composition checks
        run: |
          cargo check -p command -p backend -p bridge -p frontend -p pandora_launcher --tests --frozen
          cargo test -p backend quickplay_tests --frozen -- --test-threads=1
          cargo test -p command windows::defender::tests --frozen -- --test-threads=1
      - name: Build Windows launcher
        run: cargo build --release -p pandora_launcher --frozen --target x86_64-pc-windows-msvc
      - name: Upload smoke executable
        uses: actions/upload-artifact@v4
        with:
          name: pandora-combined-laptop-smoke
          path: target/x86_64-pc-windows-msvc/release/pandora_launcher.exe
          if-no-files-found: error
