name: Persistent layout Windows smoke artifact

on:
  push:
    branches: [codex/persistent-layout-laptop-smoke]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-portable-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Build portable launcher executable
        run: cargo build --release --frozen --target x86_64-pc-windows-msvc
      - name: Publish exact smoke executable
        uses: actions/upload-artifact@v4
        with:
          name: pandora-persistent-layout-windows-${{ github.sha }}
          path: target/x86_64-pc-windows-msvc/release/pandora_launcher.exe
          if-no-files-found: error
