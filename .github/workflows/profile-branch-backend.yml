name: Persistent profile branch backend

on:
  pull_request:
    paths:
      - "crates/backend/src/lib.rs"
      - "crates/backend/src/profile_branch.rs"
      - "crates/backend/src/profile_layout_flow.rs"
      - "crates/backend/src/profile_layout_identity.rs"
      - "crates/backend/src/profile_layout_service.rs"
      - ".github/workflows/profile-branch-backend.yml"

permissions:
  contents: read

concurrency:
  group: profile-branch-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile-branch-backend:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install backend build dependencies
        run: sudo apt-get update --yes && sudo apt-get install --yes libssl-dev libdbus-1-dev libx11-xcb1 libxkbcommon-x11-dev pkg-config libseccomp-dev libfontconfig-dev libudev-dev
      - name: Check formatting of changed Rust files
        run: rustfmt --edition 2024 --config skip_children=true --check crates/backend/src/lib.rs crates/backend/src/profile_branch.rs crates/backend/src/profile_layout_flow.rs crates/backend/src/profile_layout_identity.rs crates/backend/src/profile_layout_service.rs
      - name: Compile backend tests
        run: cargo check -p backend --tests --frozen
      - name: Test profile branch and persistent layout behavior
        run: cargo test -p backend profile_layout --frozen -- --test-threads=1 && cargo test -p backend profile_branch --frozen -- --test-threads=1
