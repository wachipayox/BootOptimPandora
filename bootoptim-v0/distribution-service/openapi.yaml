openapi: 3.1.0
info:
  title: BootOptim Private Modpack Distribution API
  version: 1.0.0-draft
  description: >-
    Publish-only API for authenticated discovery of official profiles, immutable
    signed revisions, deterministic inheritance metadata, and SHA-256 addressed
    objects. It does not inspect or mutate player game directories.
servers:
  - url: https://packs.example.invalid
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      security: []
      operationId: healthz
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    const: ok
  /v1/profiles:
    get:
      operationId: listProfiles
      description: Returns only profiles and channels visible to the authenticated subject.
      responses:
        '200':
          description: Accessible profiles.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [profiles]
                properties:
                  profiles:
                    type: array
                    items:
                      $ref: '#/components/schemas/Profile'
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/profiles/{profile_id}:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
    get:
      operationId: getProfile
      responses:
        '200':
          description: Accessible profile metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/profiles/{profile_id}/channels/{channel}:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
      - $ref: '#/components/parameters/Channel'
    get:
      operationId: getChannelHead
      description: >-
        Returns the currently published immutable revision for an accessible
        channel. Clients must enforce monotonic sequence and signed rollback
        authorization as defined by the architecture document.
      responses:
        '200':
          description: Channel head.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelHead'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/revisions/{revision_id}:
    parameters:
      - $ref: '#/components/parameters/RevisionId'
    get:
      operationId: getRevision
      responses:
        '200':
          description: Signed immutable revision envelope.
          headers:
            ETag:
              schema: { type: string }
              description: Quoted manifest SHA-256.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedRevisionEnvelope'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/revisions/{revision_id}/resolution:
    parameters:
      - $ref: '#/components/parameters/RevisionId'
    get:
      operationId: resolveRevision
      description: >-
        Convenience projection of the pinned inheritance chain. The client must
        verify every signed revision and deterministically recompute the effective
        set; this response is not a new trust root.
      responses:
        '200':
          description: Pinned chain and effective object projection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resolution'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Invalid inheritance, cycle, expectation mismatch, or permission violation.
  /v1/objects/sha256/{sha256}:
    parameters:
      - $ref: '#/components/parameters/Sha256'
    get:
      operationId: getObject
      description: >-
        Streams a content-addressed object only when the subject can access at
        least one revision/profile referencing it. Supports HTTP Range.
      responses:
        '200':
          description: Complete object.
          headers:
            ETag:
              schema: { type: string }
            Cache-Control:
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '206':
          description: Partial object for a valid Range request.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    head:
      operationId: headObject
      responses:
        '200':
          description: Accessible object metadata.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/keys/revision-signing:
    get:
      operationId: listRevisionSigningKeys
      description: >-
        Informational key metadata. Clients trust only launcher-pinned/root-signed
        keys; this endpoint cannot introduce a new trust root by itself.
      responses:
        '200':
          description: Public revision-signing key metadata.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [keys]
                properties:
                  keys:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublicSigningKey'
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/admin/objects/sha256/{sha256}:
    parameters:
      - $ref: '#/components/parameters/Sha256'
    put:
      operationId: putObject
      description: >-
        Idempotently uploads bytes for an expected SHA-256. The service computes
        the digest before publishing the object into the immutable CAS.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '201': { description: Object verified and published. }
        '204': { description: Identical object already exists. }
        '400': { description: Length or SHA-256 mismatch. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/admin/revisions:
    post:
      operationId: publishRevision
      description: >-
        Imports a pre-signed revision. The service validates canonical manifest
        digest, Ed25519 signature, schema, base pin, monotonic sequence,
        inheritance permissions, and existence/hash metadata for all direct
        objects before making the revision discoverable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignedRevisionEnvelope'
      responses:
        '201':
          description: Immutable revision stored but not necessarily promoted to a channel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevisionReceipt'
        '409': { description: Revision id/sequence collision or invalid base state. }
        '422': { description: Signature, schema, object, permission, or inheritance validation failed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/admin/profiles/{profile_id}/channels/{channel}/promote:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
      - $ref: '#/components/parameters/Channel'
    post:
      operationId: promoteChannel
      description: Compare-and-swap promotion of a channel head to an immutable revision.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromoteRequest'
      responses:
        '200':
          description: New channel head.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelHead'
        '409': { description: Expected current head does not match. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/admin/profiles/{profile_id}/channels/{channel}/rollback:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
      - $ref: '#/components/parameters/Channel'
    post:
      operationId: rollbackChannel
      description: >-
        Moves a channel head to an older immutable revision only with a detached
        release-key signature over the rollback statement. The event is immutable
        and returned to clients so a lower sequence is not accepted silently.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RollbackRequest'
      responses:
        '200':
          description: Signed rollback event and resulting head.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RollbackResult'
        '409': { description: Expected current head does not match. }
        '422': { description: Rollback signature or target revision is invalid. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Short-lived token from the configured private identity provider. The
        service validates issuer, audience, signature, expiry and stable subject;
        Minecraft/Microsoft access tokens are not accepted as service credentials.
  parameters:
    ProfileId:
      name: profile_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^profile_[a-z0-9][a-z0-9_-]{2,63}$'
    RevisionId:
      name: revision_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^rev_[A-Za-z0-9_-]{16,80}$'
    Channel:
      name: channel
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9_-]{0,31}$'
    Sha256:
      name: sha256
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9a-f]{64}$'
  responses:
    Unauthorized:
      description: Missing, expired, or invalid authentication.
    Forbidden:
      description: Authenticated subject lacks the required admin permission.
    NotFound:
      description: Resource is absent or intentionally hidden from this subject.
  schemas:
    Profile:
      type: object
      additionalProperties: false
      required: [id, name, official, deletable, derivable, channels]
      properties:
        id: { type: string }
        name: { type: string }
        official: { const: true }
        deletable: { const: false }
        derivable: { type: boolean }
        channels:
          type: array
          items:
            type: string
    ChannelHead:
      type: object
      additionalProperties: false
      required: [profile_id, channel, revision_id, sequence, manifest_sha256]
      properties:
        profile_id: { type: string }
        channel: { type: string }
        revision_id: { type: string }
        sequence: { type: integer, minimum: 1 }
        manifest_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        rollback_event:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/RollbackEvent'
    Signature:
      type: object
      additionalProperties: false
      required: [key_id, algorithm, value]
      properties:
        key_id: { type: string, minLength: 1, maxLength: 128 }
        algorithm: { const: Ed25519 }
        value:
          type: string
          description: Base64url without padding.
    SignedRevisionEnvelope:
      type: object
      additionalProperties: false
      required: [canonicalization, manifest_sha256, manifest, signature]
      properties:
        canonicalization: { const: RFC8785-JCS }
        manifest_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        manifest:
          $ref: './revision-manifest.schema.json'
        signature:
          $ref: '#/components/schemas/Signature'
    PublicSigningKey:
      type: object
      additionalProperties: false
      required: [key_id, algorithm, public_key, state]
      properties:
        key_id: { type: string }
        algorithm: { const: Ed25519 }
        public_key:
          type: string
          description: Base64url encoded 32-byte public key.
        state:
          type: string
          enum: [active, retired]
    RevisionReceipt:
      type: object
      additionalProperties: false
      required: [revision_id, manifest_sha256, stored]
      properties:
        revision_id: { type: string }
        manifest_sha256: { type: string }
        stored: { const: true }
    Resolution:
      type: object
      additionalProperties: false
      required: [target_revision_id, chain, effective, resolution_sha256]
      properties:
        target_revision_id: { type: string }
        chain:
          type: array
          minItems: 1
          maxItems: 9
          items:
            type: object
            additionalProperties: false
            required: [profile_id, revision_id, manifest_sha256, signature]
            properties:
              profile_id: { type: string }
              revision_id: { type: string }
              manifest_sha256: { type: string }
              signature: { $ref: '#/components/schemas/Signature' }
        effective:
          type: object
          additionalProperties: false
          required: [minecraft, neoforge, mods, configs, objects]
          properties:
            minecraft: { type: string }
            neoforge: { type: string }
            mods:
              type: array
              items: { type: object }
            configs:
              type: array
              items: { type: object }
            objects:
              type: array
              items: { type: object }
        resolution_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
    PromoteRequest:
      type: object
      additionalProperties: false
      required: [revision_id, expected_current_revision_id]
      properties:
        revision_id: { type: string }
        expected_current_revision_id:
          oneOf:
            - type: 'null'
            - type: string
    RollbackStatement:
      type: object
      additionalProperties: false
      required: [profile_id, channel, from_revision_id, from_sequence, to_revision_id, reason, issued_at]
      properties:
        profile_id: { type: string }
        channel: { type: string }
        from_revision_id: { type: string }
        from_sequence: { type: integer, minimum: 1 }
        to_revision_id: { type: string }
        reason: { type: string, minLength: 1, maxLength: 2048 }
        issued_at: { type: string, format: date-time }
    RollbackRequest:
      type: object
      additionalProperties: false
      required: [statement, signature]
      properties:
        statement: { $ref: '#/components/schemas/RollbackStatement' }
        signature: { $ref: '#/components/schemas/Signature' }
    RollbackEvent:
      type: object
      additionalProperties: false
      required: [event_id, statement_sha256, statement, signature]
      properties:
        event_id: { type: string }
        statement_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        statement: { $ref: '#/components/schemas/RollbackStatement' }
        signature: { $ref: '#/components/schemas/Signature' }
    RollbackResult:
      type: object
      additionalProperties: false
      required: [head, rollback_event]
      properties:
        head: { $ref: '#/components/schemas/ChannelHead' }
        rollback_event: { $ref: '#/components/schemas/RollbackEvent' }
