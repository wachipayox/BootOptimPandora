# Include INSIDE the existing HTTPS server {} for welite.ddns.net on port 443.
# Distribution remains bound to its private LAN address with the existing CIDR
# and administrator authentication. Only these read routes are exposed here.
# Do not proxy /admin or /v1/admin to Distribution.
location ~ ^/v1/(profiles(?:/profile_[A-Za-z0-9_-]+/revisions(?:/rev_[A-Za-z0-9_-]+)?)?|objects/sha256/[0-9a-f]{64}|signing-keys|meta/version)$ {
    limit_except GET {
        deny all;
    }

    proxy_pass https://192.168.1.69:8444;
    proxy_http_version 1.1;
    proxy_set_header Host welite.ddns.net;
    proxy_set_header Connection "";

    proxy_ssl_server_name on;
    proxy_ssl_name welite.ddns.net;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth 4;

    proxy_connect_timeout 5s;
    proxy_read_timeout 300s;
    proxy_buffering off;
    proxy_max_temp_file_size 0;
    add_header X-Content-Type-Options nosniff always;
}
