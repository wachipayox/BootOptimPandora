plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.144'
}
group = 'net.wachiland.atlasbatch'
version = '0.2.30-bench-fixes'
base { archivesName = 'wachiland-android-support-neoforge-1.21.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
    version = '21.1.248'
    mods { wachiland_android_support { sourceSet(sourceSets.main) } }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
def earlyCompat = sourceSets.create('earlyCompat') {
    java.srcDir 'early-compat/src/main/java'
    compileClasspath = sourceSets.main.compileClasspath
}
tasks.named('compileEarlyCompatJava', JavaCompile) {
    sourceCompatibility = '17'
    targetCompatibility = '17'
    options.compilerArgs.addAll(['--add-exports','java.base/jdk.internal.org.objectweb.asm=ALL-UNNAMED','--add-exports','java.base/jdk.internal.org.objectweb.asm.tree=ALL-UNNAMED'])
}
def earlyCompatJar = tasks.register('earlyCompatJar', Jar) {
    from earlyCompat.output
    exclude '**/EarlyBridge*.class', '**/ModuleGraphClosure*.class', '**/LifecycleBridge*.class'
    archiveFileName = 'wachiland-android-early-compat.jar'
    destinationDirectory = layout.buildDirectory.dir('early-compat')
    manifest.attributes('Premain-Class': 'net.wachiland.android.compat.EarlyCompatBootstrap','Can-Retransform-Classes':'true')
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
def earlyBridgeJar = tasks.register('earlyBridgeJar', Jar) {
    from earlyCompat.output
    include '**/EarlyBridge*.class', '**/ModuleGraphClosure*.class', '**/LifecycleBridge*.class'
    archiveFileName = 'wachiland-android-early-bridge.jar'
    destinationDirectory = layout.buildDirectory.dir('early-compat')
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.named('jar') {
    dependsOn earlyCompatJar, earlyBridgeJar
    from(earlyCompatJar.flatMap { it.archiveFile }) { into 'META-INF/wachiland'; rename { 'early-compat.jar' } }
    from(earlyBridgeJar.flatMap { it.archiveFile }) { into 'META-INF/wachiland'; rename { 'early-bridge.jar' } }
    from('COPYING') { into 'META-INF' }
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
